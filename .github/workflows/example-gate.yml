name: Example Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install example verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # Swiftly-backed v3 resolves current official Swift releases; v2's
      # legacy version catalogue does not contain the qualified 6.3.3 toolchain.
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc # v3
        with:
          swift-version: '6.3.3'
      - run: ./scripts/verify-examples.sh
