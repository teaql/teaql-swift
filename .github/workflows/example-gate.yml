name: Example Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - run: ./scripts/verify-examples.sh
