name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Test signed matching release tag gate
        run: python3 scripts/test_verify_signed_release.py
      - name: Require signed S3 and root tags on version pushes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-signed-release.py
      - name: Install SQLite headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build --jobs 2
      - name: Test
        run: swift test --jobs 2
      - name: Build Release product
        run: swift build -c release --jobs 2
  real-s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install real parser and SQLite tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev ffmpeg libreoffice-writer libreoffice-calc bubblewrap util-linux
      - name: Run all independent package tests against disposable RustFS
        run: |
          python3 -m venv "$RUNNER_TEMP/teaql-s3-python"
          "$RUNNER_TEMP/teaql-s3-python/bin/python" -m pip install --disable-pip-version-check -r scripts/requirements-real-s3.txt
          "$RUNNER_TEMP/teaql-s3-python/bin/python" scripts/run-real-s3-suite.py --log "$RUNNER_TEMP/teaql-s3-suite.log"
